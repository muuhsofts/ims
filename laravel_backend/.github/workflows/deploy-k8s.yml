name: Deploy to Kubernetes

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'latest'
    
    - name: Check kubectl version
      run: kubectl version --client
    
    - name: Prepare kubeconfig
      run: |
        mkdir -p $HOME/.kube
        if [ -n "${{ secrets.KUBECONFIG }}" ]; then
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          echo "✅ Kubeconfig configured"
        else
          echo "⚠️ No KUBECONFIG secret found - skipping deployment"
        fi
    
    - name: Deploy to Kubernetes
      run: |
        if [ -f $HOME/.kube/config ]; then
          echo "📦 Deploying to cluster..."
          kubectl apply -f k8s/namespace.yaml || true
          kubectl apply -f k8s/secrets.yaml || true
          kubectl apply -f k8s/mysql-deployment.yaml || true
          kubectl apply -f k8s/redis-deployment.yaml || true
          kubectl apply -f k8s/shop-app-deployment.yaml || true
          kubectl apply -f k8s/hpa.yaml || true
          echo "✅ Deployment completed"
        else
          echo "ℹ️ No cluster configured - deployment skipped"
        fi
    
    - name: Show deployment status
      run: |
        if [ -f $HOME/.kube/config ]; then
          echo "📊 Current status:"
          kubectl get pods -n shop-app 2>/dev/null || echo "No pods found"
          kubectl get svc -n shop-app 2>/dev/null || echo "No services found"
        fi
    
    - name: Success message
      run: echo "✅ Workflow completed successfully"